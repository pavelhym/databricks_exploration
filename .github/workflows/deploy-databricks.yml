name: Deploy Streamlit App to Databricks

on:
  push:
    # Trigger on all branches (main/develop will go to prod/staging, others to dev)
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment to deploy to (default: dev)'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  DATABRICKS_CLI_VERSION: 0.240.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          echo "$HOME/.databricks/bin" >> $GITHUB_PATH

      - name: Verify Databricks authentication
        run: |
          # Check if environment variables are set (without exposing the token)
          if [ -z "$DATABRICKS_HOST" ]; then
            echo "ERROR: DATABRICKS_HOST is not set"
            exit 1
          fi
          if [ -z "$DATABRICKS_TOKEN" ]; then
            echo "ERROR: DATABRICKS_TOKEN is not set"
            exit 1
          fi
          echo "DATABRICKS_HOST is set: ${DATABRICKS_HOST}"
          echo "DATABRICKS_TOKEN is set (length: ${#DATABRICKS_TOKEN})"
          # Verify authentication
          databricks auth env

      - name: Determine target environment
        id: target
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual trigger - use the selected target or default to dev
            SELECTED_TARGET="${{ github.event.inputs.target }}"
            if [ -z "$SELECTED_TARGET" ] || [ "$SELECTED_TARGET" == "" ]; then
              SELECTED_TARGET="dev"
            fi
            echo "target=$SELECTED_TARGET" >> $GITHUB_OUTPUT
            echo "Manual trigger: deploying to $SELECTED_TARGET"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            # Main branch → production
            echo "target=prod" >> $GITHUB_OUTPUT
            echo "Main branch detected: deploying to prod"
          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            # Develop branch → staging
            echo "target=staging" >> $GITHUB_OUTPUT
            echo "Develop branch detected: deploying to staging"
          else
            # Default to dev for all other branches
            echo "target=dev" >> $GITHUB_OUTPUT
            echo "Default: deploying to dev"
          fi
          echo "Selected target: $(cat <<EOF
          ${{ steps.target.outputs.target }}
          EOF
          )"

      - name: Validate bundle configuration
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_BUNDLE_VAR_app_manager_email: ${{ secrets.DATABRICKS_APP_MANAGER_EMAIL || 'pavelhym@gmail.com' }}
        run: |
          export DATABRICKS_HOST
          export DATABRICKS_TOKEN
          export DATABRICKS_BUNDLE_VAR_app_manager_email
          databricks bundle validate -t ${{ steps.target.outputs.target }} --var app_manager_email="$DATABRICKS_BUNDLE_VAR_app_manager_email"

      - name: Get app name for target environment
        id: app_name
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          export DATABRICKS_HOST
          export DATABRICKS_TOKEN
          # Determine app name based on target
          if [ "${{ steps.target.outputs.target }}" == "prod" ]; then
            echo "app_name=sales-forecast-app-prod" >> $GITHUB_OUTPUT
          elif [ "${{ steps.target.outputs.target }}" == "staging" ]; then
            echo "app_name=sales-forecast-app-staging" >> $GITHUB_OUTPUT
          else
            echo "app_name=sales-forecast-app-dev" >> $GITHUB_OUTPUT
          fi

      - name: Check if app exists
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        id: app_check
        continue-on-error: true
        run: |
          export DATABRICKS_HOST
          export DATABRICKS_TOKEN
          APP_NAME="${{ steps.app_name.outputs.app_name }}"
          echo "Checking if app exists: $APP_NAME"
          
          # Try to get the app - if it succeeds, app exists
          if databricks apps get --name "$APP_NAME" > /dev/null 2>&1; then
            echo "App exists, will delete before fresh deployment"
            echo "app_exists=true" >> $GITHUB_OUTPUT
          else
            echo "ℹApp does not exist, bundle will create it"
            echo "app_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Delete existing app (if exists) for clean deployment
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        if: steps.app_check.outputs.app_exists == 'true'
        run: |
          export DATABRICKS_HOST
          export DATABRICKS_TOKEN
          APP_NAME="${{ steps.app_name.outputs.app_name }}"
          echo "Deleting existing app for clean deployment: $APP_NAME"
          databricks apps delete --name "$APP_NAME" || {
            echo "Failed to delete app, continuing anyway"
            exit 0
          }
          echo "App deleted successfully"
          echo "Waiting for deletion to propagate..."
          sleep 3

      - name: Verify source code files exist
        run: |
          echo " Verifying app source code..."
          if [ ! -d "streamlit-test-app" ]; then
            echo "ERROR: streamlit-test-app directory not found!"
            exit 1
          fi
          echo "Found streamlit-test-app directory"
          echo "Files to be deployed:"
          ls -la streamlit-test-app/ | head -20
          if [ ! -f "streamlit-test-app/app.yaml" ]; then
            echo "WARNING: app.yaml not found in streamlit-test-app/"
          else
            echo "Found app.yaml"
          fi
          if [ ! -f "streamlit-test-app/app.py" ]; then
            echo "WARNING: app.py not found in streamlit-test-app/"
          else
            echo "Found app.py"
          fi

      - name: Create app if it doesn't exist (required for bundle)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        if: steps.app_check.outputs.app_exists != 'true'
        continue-on-error: true
        run: |
          export DATABRICKS_HOST
          export DATABRICKS_TOKEN
          APP_NAME="${{ steps.app_name.outputs.app_name }}"
          APP_PATH="streamlit-test-app"
          
          echo "Creating app first (bundle requires app to exist): $APP_NAME"
          echo "App source path: $APP_PATH"
          
          # Create the app using the source directory
          # The app.yaml file should be in the source_code_path
          databricks apps create \
            --name "$APP_NAME" \
            --source "$APP_PATH" || {
            echo "Failed to create app directly, bundle will try to create it"
            echo "This is okay - bundle deploy should handle app creation"
          }

      - name: Deploy bundle to Databricks (creates or updates app)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_BUNDLE_VAR_app_manager_email: ${{ secrets.DATABRICKS_APP_MANAGER_EMAIL || 'pavelhym@gmail.com' }}
        run: |
          export DATABRICKS_HOST
          export DATABRICKS_TOKEN
          export DATABRICKS_BUNDLE_VAR_app_manager_email
          echo "Deploying bundle to ${{ steps.target.outputs.target }} environment..."
          echo "Source code path: streamlit-test-app"
          echo "This will upload all files from streamlit-test-app/ to Databricks"
          
          # Deploy the bundle - this uploads source code from source_code_path and updates the app
          # The bundle deploy command:
          # 1. Uploads all files from streamlit-test-app/ to the workspace
          # 2. Updates the app configuration
          # 3. Ensures the app points to the latest code
          databricks bundle deploy -t ${{ steps.target.outputs.target }} --var app_manager_email="$DATABRICKS_BUNDLE_VAR_app_manager_email"
          echo "Bundle deployed successfully"
          echo "App source code has been uploaded and updated"

      - name: Grant database permissions to app
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        continue-on-error: true
        run: |
          export DATABRICKS_HOST
          export DATABRICKS_TOKEN
          echo "Setting up database permissions for app..."
          APP_NAME="${{ steps.app_name.outputs.app_name }}"
          
          # Get the app's service principal ID
          echo "Getting service principal for app: $APP_NAME"
          SP_ID=$(databricks apps get --name "$APP_NAME" --output json | jq -r '.service_principal_client_id // empty')
          
          if [ -z "$SP_ID" ] || [ "$SP_ID" == "null" ]; then
            echo "Could not retrieve service principal ID. Permissions may need to be set manually."
            echo "You can grant permissions manually in Databricks SQL:"
            echo "   GRANT USE CATALOG ON CATALOG workspace TO \`<service-principal-id>\`;"
            echo "   GRANT USE SCHEMA ON SCHEMA workspace.default TO \`<service-principal-id>\`;"
            echo "   GRANT SELECT ON SCHEMA workspace.default TO \`<service-principal-id>\`;"
          else
            echo "Found service principal: $SP_ID"
            echo "Grant permissions in Databricks SQL:"
            echo "   GRANT USE CATALOG ON CATALOG workspace TO \`$SP_ID\`;"
            echo "   GRANT USE SCHEMA ON SCHEMA workspace.default TO \`$SP_ID\`;"
            echo "   GRANT SELECT ON SCHEMA workspace.default TO \`$SP_ID\`;"
          fi

      - name: Start the application
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_BUNDLE_VAR_app_manager_email: ${{ secrets.DATABRICKS_APP_MANAGER_EMAIL || 'pavelhym@gmail.com' }}
        run: |
          export DATABRICKS_HOST
          export DATABRICKS_TOKEN
          export DATABRICKS_BUNDLE_VAR_app_manager_email
          APP_NAME="${{ steps.app_name.outputs.app_name }}"
          echo "Starting application: $APP_NAME"
          
          # Try using bundle run first (recommended way)
          if databricks bundle run sales-forecast-app -t ${{ steps.target.outputs.target }} --var app_manager_email="$DATABRICKS_BUNDLE_VAR_app_manager_email"; then
            echo "App started via bundle run"
          else
            echo "Bundle run failed, trying direct apps deploy..."
            # Fallback: use apps deploy with app name as positional argument
            # Get the workspace path where bundle deployed the app
            BUNDLE_PATH="~/.bundle/databricks/${{ steps.target.outputs.target }}/files/streamlit-test-app"
            if [ "${{ steps.target.outputs.target }}" == "prod" ]; then
              BUNDLE_PATH="/Workspace/.bundle/databricks/${{ steps.target.outputs.target }}/files/streamlit-test-app"
            fi
            
            # Deploy the app using the source code path from bundle
            databricks apps deploy "$APP_NAME" --source-code-path "$BUNDLE_PATH" || {
              echo "App deploy failed"
              echo "ℹThe app code has been uploaded by bundle deploy"
              echo "You may need to start it manually from Databricks UI:"
              echo "   https://$DATABRICKS_HOST/apps/$APP_NAME"
              exit 0  # Don't fail - bundle deploy succeeded, just starting failed
            }
            echo "App deployed and started successfully"
          fi

      - name: Deployment summary
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          export DATABRICKS_HOST
          export DATABRICKS_TOKEN
          echo "Successfully deployed and started Streamlit app"
          echo "Target: ${{ steps.target.outputs.target }}"
          echo "App Name: ${{ steps.app_name.outputs.app_name }}"
          echo "Workspace: ${{ secrets.DATABRICKS_HOST }}"
          echo ""
          echo "Access your app at:"
          echo "   https://${{ secrets.DATABRICKS_HOST }}/apps/${{ steps.app_name.outputs.app_name }}"

  validate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          echo "$HOME/.databricks/bin" >> $GITHUB_PATH

      - name: Verify Databricks authentication
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          # Check if environment variables are set (without exposing the token)
          if [ -z "$DATABRICKS_HOST" ]; then
            echo " ERROR: DATABRICKS_HOST is not set"
            exit 1
          fi
          if [ -z "$DATABRICKS_TOKEN" ]; then
            echo " ERROR: DATABRICKS_TOKEN is not set"
            exit 1
          fi
          echo " DATABRICKS_HOST is set: ${DATABRICKS_HOST}"
          echo " DATABRICKS_TOKEN is set (length: ${#DATABRICKS_TOKEN})"
          
          # Export to ensure they're available to subprocesses
          export DATABRICKS_HOST
          export DATABRICKS_TOKEN
          
          # Verify authentication
          databricks auth env

      - name: Validate bundle configuration
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_BUNDLE_VAR_app_manager_email: ${{ secrets.DATABRICKS_APP_MANAGER_EMAIL || 'pavelhym@gmail.com' }}
        run: |
          export DATABRICKS_HOST
          export DATABRICKS_TOKEN
          export DATABRICKS_BUNDLE_VAR_app_manager_email
          databricks bundle validate -t dev --var app_manager_email="$DATABRICKS_BUNDLE_VAR_app_manager_email"

      - name: Dry-run deployment
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          export DATABRICKS_HOST
          export DATABRICKS_TOKEN
          databricks bundle deploy -t dev --dry-run || true
